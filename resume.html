<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title> Brian's Resume </title>
    </head>
    <body>
        <h1> My Resume </h1>
        <input type = "text" id = "urlInput" placeholder="My Resume is missing, oh no!" style= "width: 300px;" />
        <button id = "loadDoc"> Load Document </button>
        <iframe id = "docViewer" style = "width:100%; height: 600px; margin-top: 10px;" src="docs\assets\BEHolly_Resume.docx"> </iframe>
        <a href="index.html"> Back </a>
        <script>
        document.getElementById('loadDoc').addEventListener('click', function () {
            let url = document.getElementById('urlInput').value;
            let viewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;
            document.getElementById('docViewer').src = viewerUrl;
        });
    </script>
    </body>
</html>
